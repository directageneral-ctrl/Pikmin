<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Astro Pikmin — Concept Island v2</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#87ceeb; font-family: 'Segoe UI', sans-serif; }
  canvas { display:block; }
  #hud {
    position: absolute; top: 12px; left: 12px; color: #fff;
    background: rgba(0,0,0,0.5); padding: 10px 14px; border-radius: 10px;
    font-size: 14px; line-height: 1.6; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  #hud b { color: #ffe066; }
  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
    margin: -10px 0 0 -10px; pointer-events: none;
  }
  #chargeRing {
    position: absolute; top: 50%; left: 50%; width: 60px; height: 60px;
    margin: -30px 0 0 -30px; pointer-events: none;
  }
  #title {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,0.5); padding: 8px 16px;
    border-radius: 20px; font-size: 13px; letter-spacing: 1px;
  }
  #chargeBar {
    position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 12px; background: rgba(0,0,0,0.5);
    border: 2px solid #fff; border-radius: 6px; overflow: hidden;
    opacity: 0; transition: opacity 0.15s;
  }
  #chargeBar.active { opacity: 1; }
  #chargeFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4ade80 0%, #facc15 50%, #ef4444 100%);
    transition: width 0.05s linear;
  }
</style>
</head>
<body>
<div id="hud">
  <div><b>WASD</b> — Move</div>
  <div><b>Mouse</b> — Look</div>
  <div><b>E / Click</b> — Pluck sprout</div>
  <div><b>Hold SPACE</b> — Charge throw</div>
  <div>Followers: <span id="count">0</span></div>
</div>
<svg id="crosshair" viewBox="0 0 20 20">
  <circle cx="10" cy="10" r="3" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
</svg>
<svg id="chargeRing" viewBox="0 0 60 60">
  <circle cx="30" cy="30" r="26" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  <circle id="chargeArc" cx="30" cy="30" r="26" fill="none" stroke="#4ade80" stroke-width="3"
          stroke-dasharray="163.36" stroke-dashoffset="163.36"
          stroke-linecap="round" transform="rotate(-90 30 30)"/>
</svg>
<div id="chargeBar"><div id="chargeFill"></div></div>
<div id="title">ASTRO PIKMIN — CONCEPT ISLAND v2</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
// ---------- Scene setup ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ed8f0);
scene.fog = new THREE.Fog(0x9ed8f0, 35, 140);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Lights ----------
const hemi = new THREE.HemisphereLight(0xcfe9ff, 0x4a7a3a, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff4d6, 1.2);
sun.position.set(25, 45, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0005;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x88aaff, 0.3);
fill.position.set(-20, 10, -10);
scene.add(fill);

// ---------- Island ----------
const ISLAND_RADIUS = 18;
const islandGeo = new THREE.CylinderGeometry(ISLAND_RADIUS, ISLAND_RADIUS + 2, 2.5, 64, 6);
const pos = islandGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const y = pos.getY(i);
  if (y > 0.5) {
    const x = pos.getX(i), z = pos.getZ(i);
    const r = Math.sqrt(x*x + z*z);
    const n = Math.sin(x*0.5)*0.2 + Math.cos(z*0.6)*0.2 + Math.sin(x*1.3+z*0.9)*0.1;
    pos.setY(i, y + n + (1 - r/ISLAND_RADIUS) * 0.5);
  }
}
islandGeo.computeVertexNormals();
const islandMat = new THREE.MeshStandardMaterial({ color: 0x7bc24f, flatShading: true, roughness: 0.9 });
const island = new THREE.Mesh(islandGeo, islandMat);
island.receiveShadow = true;
island.position.y = -0.7;
scene.add(island);

// Dirt layer under grass
const dirtGeo = new THREE.CylinderGeometry(ISLAND_RADIUS + 0.3, ISLAND_RADIUS + 1.8, 1.5, 48, 1);
const dirtMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, flatShading: true, roughness: 1 });
const dirt = new THREE.Mesh(dirtGeo, dirtMat);
dirt.position.y = -1.5;
dirt.receiveShadow = true;
scene.add(dirt);

// Sandy beach rim
const rimGeo = new THREE.TorusGeometry(ISLAND_RADIUS + 0.6, 0.9, 10, 64);
const rimMat = new THREE.MeshStandardMaterial({ color: 0xf0d9a0, flatShading: true, roughness: 1 });
const rim = new THREE.Mesh(rimGeo, rimMat);
rim.rotation.x = Math.PI/2;
rim.position.y = -0.5;
rim.receiveShadow = true;
scene.add(rim);

// Water
const waterGeo = new THREE.PlaneGeometry(400, 400, 50, 50);
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x3a8fd6, transparent: true, opacity: 0.88,
  flatShading: true, metalness: 0.3, roughness: 0.3
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI/2;
water.position.y = -1.5;
scene.add(water);

// ---------- Decorations ----------
function makeRock(s) {
  const g = new THREE.DodecahedronGeometry(s, 0);
  const m = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.08, 0.1, 0.45 + Math.random()*0.15),
    flatShading: true, roughness: 0.9
  });
  const mesh = new THREE.Mesh(g, m);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
for (let i = 0; i < 10; i++) {
  const a = Math.random()*Math.PI*2;
  const r = 3 + Math.random()*(ISLAND_RADIUS-4);
  const rock = makeRock(0.4 + Math.random()*0.8);
  rock.position.set(Math.cos(a)*r, 0.2, Math.sin(a)*r);
  rock.rotation.set(Math.random(), Math.random(), Math.random());
  scene.add(rock);
}

// Daisies (white petals, yellow center)
function makeDaisy() {
  const g = new THREE.Group();
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.03, 0.04, 0.5, 5),
    new THREE.MeshStandardMaterial({ color: 0x3a8a3a })
  );
  stem.position.y = 0.25;
  g.add(stem);
  const center = new THREE.Mesh(
    new THREE.SphereGeometry(0.1, 8, 6),
    new THREE.MeshStandardMaterial({ color: 0xffd93d, flatShading: true })
  );
  center.position.y = 0.55;
  g.add(center);
  for (let i = 0; i < 6; i++) {
    const petal = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 6, 4),
      new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true })
    );
    petal.scale.set(1.3, 0.4, 1);
    const ang = (i/6) * Math.PI*2;
    petal.position.set(Math.cos(ang)*0.14, 0.55, Math.sin(ang)*0.14);
    petal.rotation.y = ang;
    g.add(petal);
  }
  return g;
}
for (let i = 0; i < 30; i++) {
  const a = Math.random()*Math.PI*2;
  const r = Math.random()*(ISLAND_RADIUS-1);
  const f = makeDaisy();
  f.position.set(Math.cos(a)*r, 0.4, Math.sin(a)*r);
  f.rotation.y = Math.random()*Math.PI*2;
  f.scale.setScalar(0.8 + Math.random()*0.5);
  scene.add(f);
}

// Clover patches
function makeClover() {
  const g = new THREE.Group();
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x4a9a3a, flatShading: true });
  for (let i = 0; i < 3; i++) {
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 4), leafMat);
    leaf.scale.set(1, 0.4, 1.3);
    const ang = (i/3) * Math.PI*2;
    leaf.position.set(Math.cos(ang)*0.1, 0.1, Math.sin(ang)*0.1);
    g.add(leaf);
  }
  return g;
}
for (let i = 0; i < 20; i++) {
  const a = Math.random()*Math.PI*2;
  const r = Math.random()*(ISLAND_RADIUS-1);
  const c = makeClover();
  c.position.set(Math.cos(a)*r, 0.4, Math.sin(a)*r);
  scene.add(c);
}

// Tall grass tufts
function makeGrassTuft() {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x5aa83a, flatShading: true, side: THREE.DoubleSide });
  for (let i = 0; i < 5; i++) {
    const blade = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.5, 3), mat);
    blade.position.set((Math.random()-0.5)*0.2, 0.25, (Math.random()-0.5)*0.2);
    blade.rotation.z = (Math.random()-0.5)*0.3;
    g.add(blade);
  }
  return g;
}
for (let i = 0; i < 40; i++) {
  const a = Math.random()*Math.PI*2;
  const r = Math.random()*(ISLAND_RADIUS-1);
  const t = makeGrassTuft();
  t.position.set(Math.cos(a)*r, 0.4, Math.sin(a)*r);
  scene.add(t);
}

// Clouds
for (let i = 0; i < 10; i++) {
  const c = new THREE.Group();
  for (let j = 0; j < 5; j++) {
    const s = new THREE.Mesh(
      new THREE.SphereGeometry(1 + Math.random()*1.5, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true })
    );
    s.position.set(j*1.4 - 2.5, Math.random()*0.5, Math.random()*0.8);
    c.add(s);
  }
  c.position.set((Math.random()-0.5)*140, 20 + Math.random()*8, (Math.random()-0.5)*140);
  c.userData.speed = 0.01 + Math.random()*0.02;
  scene.add(c);
}

// ---------- Astronaut Player ----------
const player = new THREE.Group();
scene.add(player);

function buildAstronaut() {
  const suit = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.6, flatShading: true });
  const dark = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.7, flatShading: true });
  const visor = new THREE.MeshStandardMaterial({
    color: 0x1a3a6b, metalness: 0.9, roughness: 0.15,
    emissive: 0x0a2040, envMapIntensity: 1
  });
  const accent = new THREE.MeshStandardMaterial({ color: 0xff5a3c, roughness: 0.5, flatShading: true });
  const blue = new THREE.MeshStandardMaterial({ color: 0x3a7fff, roughness: 0.5, flatShading: true });

  // Body (torso)
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.55, 6, 10), suit);
  body.position.y = 0.9;
  body.castShadow = true;
  player.add(body);

  // Backpack (jetpack)
  const pack = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.35), dark);
  pack.position.set(0, 0.95, -0.4);
  pack.castShadow = true;
  player.add(pack);
  // Pack thrusters
  const thrL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.2, 8), dark);
  thrL.position.set(-0.2, 0.55, -0.5);
  player.add(thrL);
  const thrR = thrL.clone(); thrR.position.x = 0.2;
  player.add(thrR);

  // Helmet
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.45, 20, 16), suit);
  helmet.position.y = 1.58;
  helmet.castShadow = true;
  player.add(helmet);

  // Helmet ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.05, 8, 20), dark);
  ring.position.y = 1.3;
  ring.rotation.x = Math.PI/2;
  player.add(ring);

  // Visor (front-facing curved)
  const visorGeo = new THREE.SphereGeometry(0.38, 20, 16, Math.PI*0.75, Math.PI*0.5, Math.PI*0.25, Math.PI*0.5);
  const visorMesh = new THREE.Mesh(visorGeo, visor);
  visorMesh.position.set(0, 1.6, 0.05);
  player.add(visorMesh);

  // Antenna
  const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.35, 6), dark);
  ant.position.set(0.22, 2.05, 0);
  player.add(ant);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), accent);
  tip.position.set(0.22, 2.25, 0);
  player.add(tip);
  player.userData.tip = tip;

  // Chest panel
  const panel = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.05), dark);
  panel.position.set(0, 0.95, 0.42);
  player.add(panel);
  const light = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 4), blue);
  light.position.set(-0.1, 1.0, 0.45);
  player.add(light);
  const light2 = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 4), accent);
  light2.position.set(0.1, 1.0, 0.45);
  player.add(light2);

  // Chest stripe
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.08, 0.44), accent);
  stripe.position.set(0, 1.15, 0);
  player.add(stripe);

  // Arms (pivoted at shoulder)
  const armPivotL = new THREE.Group();
  armPivotL.position.set(-0.48, 1.15, 0);
  const armL = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.5, 6, 8), suit);
  armL.position.y = -0.3;
  armL.castShadow = true;
  armPivotL.add(armL);
  const gloveL = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), dark);
  gloveL.position.y = -0.6;
  armPivotL.add(gloveL);
  player.add(armPivotL);
  player.userData.armPivotL = armPivotL;

  const armPivotR = new THREE.Group();
  armPivotR.position.set(0.48, 1.15, 0);
  const armR = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.5, 6, 8), suit);
  armR.position.y = -0.3;
  armR.castShadow = true;
  armPivotR.add(armR);
  const gloveR = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), dark);
  gloveR.position.y = -0.6;
  armPivotR.add(gloveR);
  player.add(armPivotR);
  player.userData.armPivotR = armPivotR;

  // Legs (pivoted at hip)
  const legPivotL = new THREE.Group();
  legPivotL.position.set(-0.2, 0.55, 0);
  const legL = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.45, 6, 8), suit);
  legL.position.y = -0.28;
  legL.castShadow = true;
  legPivotL.add(legL);
  const bootL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.15, 0.32), dark);
  bootL.position.set(0, -0.55, 0.05);
  legPivotL.add(bootL);
  player.add(legPivotL);
  player.userData.legPivotL = legPivotL;

  const legPivotR = new THREE.Group();
  legPivotR.position.set(0.2, 0.55, 0);
  const legR = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.45, 6, 8), suit);
  legR.position.y = -0.28;
  legR.castShadow = true;
  legPivotR.add(legR);
  const bootR = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.15, 0.32), dark);
  bootR.position.set(0, -0.55, 0.05);
  legPivotR.add(bootR);
  player.add(legPivotR);
  player.userData.legPivotR = legPivotR;
}
buildAstronaut();
player.position.set(0, 0.5, 0);

// ---------- Pikmin (authentic style) ----------
const PIKMIN_COLORS = [
  { body: 0xe74c3c, name: 'red' },
  { body: 0xf4c430, name: 'yellow' },
  { body: 0x3498db, name: 'blue' }
];

function makePikmin(colorHex) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.7, flatShading: true });
  const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
  const black = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.3 });

  // HEAD (big, dominant — Pikmin are basically heads)
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12), bodyMat);
  head.scale.set(1, 1.05, 1);
  head.position.y = 0.55;
  head.castShadow = true;
  g.add(head);

  // Cheeks (slight bulge)
  const cheekL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6), bodyMat);
  cheekL.position.set(-0.2, 0.5, 0.1);
  g.add(cheekL);
  const cheekR = cheekL.clone();
  cheekR.position.x = 0.2;
  g.add(cheekR);

  // EYES (big, round, white with black pupils)
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), white);
  eyeL.position.set(-0.12, 0.62, 0.22);
  g.add(eyeL);
  const eyeR = eyeL.clone();
  eyeR.position.x = 0.12;
  g.add(eyeR);

  // Pupils
  const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), black);
  pupilL.position.set(-0.12, 0.62, 0.3);
  g.add(pupilL);
  const pupilR = pupilL.clone();
  pupilR.position.x = 0.12;
  g.add(pupilR);

  // Eye shine (tiny white dot)
  const shineL = new THREE.Mesh(new THREE.SphereGeometry(0.02, 6, 4), white);
  shineL.position.set(-0.14, 0.64, 0.33);
  g.add(shineL);
  const shineR = shineL.clone();
  shineR.position.x = 0.1;
  g.add(shineR);

  // NOSE (small pointed cone — iconic Pikmin feature)
  const nose = new THREE.Mesh(
    new THREE.ConeGeometry(0.04, 0.1, 6),
    bodyMat
  );
  nose.position.set(0, 0.5, 0.3);
  nose.rotation.x = -Math.PI/2;
  g.add(nose);

  // BODY (smaller, merged with head)
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10), bodyMat);
  body.scale.set(1, 1.1, 0.9);
  body.position.y = 0.28;
  body.castShadow = true;
  g.add(body);

  // ARMS (small, stubby)
  const armL = new THREE.Mesh(new THREE.CapsuleGeometry(0.05, 0.15, 4, 6), bodyMat);
  armL.position.set(-0.22, 0.3, 0.05);
  armL.rotation.z = 0.6;
  armL.rotation.x = -0.3;
  g.add(armL);
  const armR = armL.clone();
  armR.position.x = 0.22;
  armR.rotation.z = -0.6;
  g.add(armR);

  // HANDS (tiny spheres)
  const handL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 4), bodyMat);
  handL.position.set(-0.32, 0.22, 0.12);
  g.add(handL);
  const handR = handL.clone();
  handR.position.x = 0.32;
  g.add(handR);

  // LEGS (small)
  const legL = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.12, 4, 6), bodyMat);
  legL.position.set(-0.1, 0.1, 0.05);
  g.add(legL);
  const legR = legL.clone();
  legR.position.x = 0.1;
  g.add(legR);

  // FEET (rounded)
  const footL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), bodyMat);
  footL.scale.set(1, 0.6, 1.4);
  footL.position.set(-0.1, 0.02, 0.08);
  g.add(footL);
  const footR = footL.clone();
  footR.position.x = 0.1;
  g.add(footR);

  // FLOWER ON TOP (stem + petals)
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x4a8a3a });
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.25, 6), stemMat);
  stem.position.y = 0.95;
  g.add(stem);

  // Petals (5 arranged in a ring)
  const petalMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true });
  for (let i = 0; i < 5; i++) {
    const petal = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 4), petalMat);
    petal.scale.set(1.2, 0.5, 1);
    const ang = (i/5) * Math.PI*2;
    petal.position.set(Math.cos(ang)*0.09, 1.1, Math.sin(ang)*0.09);
    petal.rotation.y = ang;
    g.add(petal);
  }
  // Flower center
  const flowerCenter = new THREE.Mesh(
    new THREE.SphereGeometry(0.05, 8, 6),
    new THREE.MeshStandardMaterial({ color: 0xffd93d, flatShading: true })
  );
  flowerCenter.position.y = 1.1;
  g.add(flowerCenter);

  g.userData.color = colorHex;
  return g;
}

// ---------- Sprouts (pluckable) ----------
const sprouts = [];
function makeSprout(colorHex) {
  const g = new THREE.Group();
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x4a8a3a });
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.7, 6), stemMat);
  stem.position.y = 0.35;
  g.add(stem);

  // Bud (colored sphere with leaf)
  const bud = new THREE.Mesh(
    new THREE.SphereGeometry(0.2, 12, 10),
    new THREE.MeshStandardMaterial({ color: colorHex, flatShading: true, roughness: 0.7 })
  );
  bud.position.y = 0.8;
  bud.castShadow = true;
  g.add(bud);

  // Leaf
  const leaf = new THREE.Mesh(
    new THREE.SphereGeometry(0.1, 8, 6),
    new THREE.MeshStandardMaterial({ color: 0x3a7a2a, flatShading: true })
  );
  leaf.scale.set(1.6, 0.4, 1);
  leaf.position.set(0.14, 0.95, 0);
  leaf.rotation.z = -0.4;
  g.add(leaf);

  g.userData.color = colorHex;
  g.userData.isSprout = true;
  return g;
}

for (let i = 0; i < 15; i++) {
  const a = Math.random()*Math.PI*2;
  const r = 2.5 + Math.random()*(ISLAND_RADIUS-4);
  const color = PIKMIN_COLORS[Math.floor(Math.random()*PIKMIN_COLORS.length)].body;
  const s = makeSprout(color);
  s.position.set(Math.cos(a)*r, 0.4, Math.sin(a)*r);
  s.rotation.y = Math.random()*Math.PI*2;
  scene.add(s);
  sprouts.push(s);
}

// ---------- Follower & thrown pikmin ----------
const followers = [];
const thrown = [];

function spawnFollower(color) {
  const p = makePikmin(color);
  p.userData.state = 'follow';
  p.userData.index = followers.length;
  scene.add(p);
  followers.push(p);
  document.getElementById('count').textContent = followers.length;
}

// ---------- Input ----------
const keys = {};
let chargeStart = 0;
let isCharging = false;
const MAX_CHARGE = 1.5; // seconds to full charge

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyE') tryPluck();
  if (e.code === 'Space' && !isCharging) {
    e.preventDefault();
    if (followers.length > 0) {
      isCharging = true;
      chargeStart = performance.now();
      document.getElementById('chargeBar').classList.add('active');
    }
  }
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space' && isCharging) {
    releaseThrow();
  }
});

let yaw = 0, pitch = -0.2;
let pointerLocked = false;
renderer.domElement.addEventListener('click', () => {
  if (!pointerLocked) {
    renderer.domElement.requestPointerLock();
  } else {
    tryPluck();
  }
});
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
});
document.addEventListener('mousemove', e => {
  if (!pointerLocked) return;
  yaw -= e.movementX * 0.0025;
  pitch -= e.movementY * 0.0025;
  pitch = Math.max(-1.2, Math.min(0.6, pitch));
});

// ---------- Actions ----------
function tryPluck() {
  let best = null, bestD = 2.2;
  for (const s of sprouts) {
    const d = s.position.distanceTo(player.position);
    if (d < bestD) { bestD = d; best = s; }
  }
  if (best) {
    const color = best.userData.color;
    const startPos = best.position.clone();
    scene.remove(best);
    sprouts.splice(sprouts.indexOf(best), 1);

    // Pop animation
    const pop = makePikmin(color);
    pop.position.copy(startPos);
    pop.scale.set(0.01, 0.01, 0.01);
    scene.add(pop);
    pop.userData.popTime = 0;
    pop.userData.popStart = startPos;
    pop.userData.isPop = true;
    thrown.push(pop);
    pop.userData.willBecomeFollower = true;
  }
}

function releaseThrow() {
  if (!isCharging || followers.length === 0) {
    isCharging = false;
    document.getElementById('chargeBar').classList.remove('active');
    document.getElementById('chargeFill').style.width = '0%';
    document.getElementById('chargeArc').setAttribute('stroke-dashoffset', '163.36');
    return;
  }
  const chargeTime = (performance.now() - chargeStart) / 1000;
  const charge = Math.min(1, chargeTime / MAX_CHARGE);

  const p = followers.pop();
  document.getElementById('count').textContent = followers.length;
  followers.forEach((f, i) => f.userData.index = i);

  // Velocity scales with charge: base 8, max 22
  const speed = 8 + charge * 14;
  const upBoost = 0.5 + charge * 0.4;
  const dir = new THREE.Vector3(-Math.sin(yaw), upBoost, -Math.cos(yaw)).normalize();
  p.userData.state = 'thrown';
  p.userData.velocity = dir.multiplyScalar(speed);
  p.userData.landed = false;
  p.userData.bounceTime = 0;
  thrown.push(p);

  isCharging = false;
  document.getElementById('chargeBar').classList.remove('active');
  document.getElementById('chargeFill').style.width = '0%';
  document.getElementById('chargeArc').setAttribute('stroke-dashoffset', '163.36');
}

// ---------- Animation loop ----------
const clock = new THREE.Clock();
let walkPhase = 0;

function updateWater(t) {
  const p = waterGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i);
    p.setZ(i, Math.sin(x*0.25 + t*1.3) * 0.18 + Math.cos(y*0.25 + t*1.1) * 0.18);
  }
  p.needsUpdate = true;
  waterGeo.computeVertexNormals();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  // Player movement
  const speed = 5;
  let vx = 0, vz = 0;
  if (keys['KeyW']) vz -= 1;
  if (keys['KeyS']) vz += 1;
  if (keys['KeyA']) vx -= 1;
  if (keys['KeyD']) vx += 1;
  const moving = (vx !== 0 || vz !== 0);
  if (moving) {
    const len = Math.hypot(vx, vz);
    vx /= len; vz /= len;
    const wx = vx * Math.cos(yaw) - vz * Math.sin(yaw);
    const wz = vx * Math.sin(yaw) + vz * Math.cos(yaw);
    player.position.x += wx * speed * dt;
    player.position.z += wz * speed * dt;
    player.rotation.y = yaw + Math.PI;
    walkPhase += dt * 10;
  } else {
    walkPhase *= 0.9;
  }

  // Keep player on island
  const pr = Math.hypot(player.position.x, player.position.z);
  if (pr > ISLAND_RADIUS - 1) {
    const s = (ISLAND_RADIUS - 1) / pr;
    player.position.x *= s; player.position.z *= s;
  }
  player.position.y = 0.5 + Math.sin(t*2) * 0.03;

  // Arm/leg swing
  if (player.userData.legPivotL) {
    player.userData.legPivotL.rotation.x = Math.sin(walkPhase) * 0.6;
    player.userData.legPivotR.rotation.x = -Math.sin(walkPhase) * 0.6;
    player.userData.armPivotL.rotation.x = -Math.sin(walkPhase) * 0.5;
    player.userData.armPivotR.rotation.x = Math.sin(walkPhase) * 0.5;
  }

  // Charging animation: wind up right arm
  if (isCharging) {
    const chargeTime = (performance.now() - chargeStart) / 1000;
    const charge = Math.min(1, chargeTime / MAX_CHARGE);
    // Pull arm back
    player.userData.armPivotR.rotation.x = -1.8 * charge;
    player.userData.armPivotR.rotation.z = -0.3 * charge;
    // Slight crouch
    player.userData.legPivotL.rotation.x = 0.2 * charge;
    player.userData.legPivotR.rotation.x = 0.2 * charge;

    // Update UI
    const pct = charge * 100;
    document.getElementById('chargeFill').style.width = pct + '%';
    const circumference = 163.36;
    document.getElementById('chargeArc').setAttribute('stroke-dashoffset', circumference * (1 - charge));
    // Color the ring based on charge
    const hue = 120 - charge * 120; // green -> red
    document.getElementById('chargeArc').setAttribute('stroke', `hsl(${hue}, 80%, 55%)`);
  }

  if (player.userData.tip) {
    player.userData.tip.material.emissive.setHSL((t*0.3)%1, 0.8, 0.4);
  }

  // Camera follow
  const camDist = 6;
  const camHeight = 2.5 + pitch * 2;
  const camX = player.position.x + Math.sin(yaw) * camDist;
  const camZ = player.position.z + Math.cos(yaw) * camDist;
  camera.position.lerp(new THREE.Vector3(camX, player.position.y + camHeight, camZ), 0.15);
  camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);

  // Sprout bob
  for (const s of sprouts) {
    s.rotation.z = Math.sin(t*2 + s.position.x) * 0.15;
    s.position.y = 0.4 + Math.sin(t*3 + s.position.z) * 0.03;
  }

  // Followers chain
  for (let i = 0; i < followers.length; i++) {
    const f = followers[i];
    const target = (i === 0) ? player : followers[i-1];
    const offset = new THREE.Vector3(
      Math.sin(yaw + Math.PI) * 0.7,
      0,
      Math.cos(yaw + Math.PI) * 0.7
    );
    const desired = target.position.clone().add(offset);
    const side = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const sideOff = (i % 2 === 0 ? 0.35 : -0.35);
    desired.add(side.multiplyScalar(sideOff));
    f.position.lerp(desired, 0.18);
    f.position.y = 0.4 + Math.abs(Math.sin(t*6 + i)) * 0.06;
    f.rotation.y = yaw + Math.PI;
    // Little hop
    f.children[0].position.y = 0.55 + Math.sin(t*8 + i) * 0.02;
  }

  // Thrown / pop animations
  for (let i = thrown.length - 1; i >= 0; i--) {
    const p = thrown[i];
    if (p.userData.isPop) {
      p.userData.popTime += dt;
      const k = p.userData.popTime;
      const s = Math.min(1, k*4);
      p.scale.set(s, s, s);
      p.position.y = p.userData.popStart.y + Math.sin(k*8) * 0.25 * Math.max(0, 1 - k*2);
      if (k > 0.5) {
        p.userData.isPop = false;
        p.userData.state = 'follow';
        p.userData.index = followers.length;
        const idx = thrown.indexOf(p);
        thrown.splice(idx, 1);
        followers.push(p);
        document.getElementById('count').textContent = followers.length;
      }
      continue;
    }
    if (p.userData.state === 'thrown' && !p.userData.landed) {
      p.userData.velocity.y -= 22 * dt;
      p.position.addScaledVector(p.userData.velocity, dt);
      p.rotation.x += dt * 12;
      p.rotation.z += dt * 8;
      if (p.position.y <= 0.4) {
        p.position.y = 0.4;
        p.userData.landed = true;
        p.userData.bounceTime = 0;
        p.userData.state = 'landed';
      }
    } else if (p.userData.state === 'landed') {
      p.userData.bounceTime += dt;
      p.position.y = 0.4 + Math.sin(p.userData.bounceTime*18) * 0.12 * Math.max(0, 1 - p.userData.bounceTime*2.5);
      p.rotation.x *= 0.9; p.rotation.z *= 0.9;
    }
  }

  // Clouds drift
  scene.children.forEach(c => {
    if (c.userData.speed) {
      c.position.x += c.userData.speed;
      if (c.position.x > 90) c.position.x = -90;
    }
  });

  updateWater(t);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
